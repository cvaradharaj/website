<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7fd"/>
      <stop offset="1" stop-color="#bfe0f5"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9fcbe8" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#grid)" opacity="0.6"/>

  <path d="M180 380 A220 220 0 0 1 620 380" fill="none" stroke="#cfe6f7" stroke-width="26" stroke-linecap="round"/>
  <path d="M180 380 A220 220 0 0 1 620 380" fill="none" stroke="#0a7f8c" stroke-width="26" stroke-linecap="round" stroke-dasharray="498 700"/>
  <line x1="400" y1="380" x2="496" y2="264" stroke="#0b3a57" stroke-width="8" stroke-linecap="round"/>
  <circle cx="400" cy="380" r="14" fill="#0b3a57"/>

  <path d="M0 480 Q 100 450 200 480 T 400 480 T 600 480 T 800 480" fill="none" stroke="#0a7f8c" stroke-width="6" stroke-dasharray="20 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-68" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <path d="M0 515 Q 100 485 200 515 T 400 515 T 600 515 T 800 515" fill="none" stroke="#5b9cc4" stroke-width="6" stroke-dasharray="20 14" opacity="0.85">
    <animate attributeName="stroke-dashoffset" from="0" to="-68" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M0 550 Q 100 520 200 550 T 400 550 T 600 550 T 800 550" fill="none" stroke="#e3a23b" stroke-width="6" stroke-dasharray="20 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-68" dur="2s" repeatCount="indefinite"/>
  </path>
</svg>
